name: Daily v2.2 Scores

# 언제 실행되나 (하루 2번: 한국장·미국장 개장 3시간+ 전)
on:
  schedule:
    # ⚠️ cron은 UTC 기준이며 서머타임 미적용.
    #    GitHub 예약 실행은 매시 '정각(:00)'·'반(:30)'에 부하가 몰려 지연·누락되기 쉬움.
    #    그래서 일부러 한산한 분(:47, :13)으로 설정해 신뢰도를 높임.
    #    (분 시 일 월 요일) 순서.
    #
    # ① 한국장 기준 05:47 KST = 전날 20:47 UTC.  (매일 — 주말·휴장 포함)
    - cron: "47 20 * * *"
    #
    # ② 미국장 기준 약 06:13 ET = 10:13 UTC.  (매일 — 주말·휴장 포함)
    - cron: "13 10 * * *"
    #
    # ⚠️ 실제 운영: 위 두 시각에는 외부 스케줄러가 workflow_dispatch로 정시 실행하고(20:47:03·10:13:03 UTC),
    #    GitHub 예약 실행은 보통 2~7시간 늦게 '추가로' 돈다(→ 하루 약 4회 커밋). 늦은 예약 실행이
    #    장중에 걸려도 engine.py가 거래소 세션 기준으로 미확정 봉을 버리므로 장중가가 커밋되지 않는다.
  workflow_dispatch:   # ← Actions 탭에서 "Run workflow" 버튼으로 수동 실행(테스트용)

# 같은 시각에 외부 실행·예약 실행이 겹치면 순서대로 하나씩(동시에 돌며 서로의 커밋을 덮지 않게)
concurrency:
  group: daily-scores
  cancel-in-progress: false

# scores.json을 다시 커밋해야 하므로 쓰기 권한 부여
permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 점수 엔진 실행
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}   # ← Settings의 Secret에서 주입(없으면 CSV로 동작)
        run: python engine.py

      - name: scores.json 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scores.json candles.json
          # 바뀐 게 없으면(주말·휴장 등) 그냥 통과
          if git diff --staged --quiet; then
            echo "변경 없음 — 통과"
          else
            git commit -m "Update scores $(date -u +%Y-%m-%d)"
            # 실행 중 원격(main)이 먼저 바뀌었을 수 있으니, rebase로 합친 뒤 푸시(충돌 시 재시도).
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then ok=1; break; fi
              echo "원격이 앞서 있어 재시도 ${i}…"; sleep 5
            done
            if [ "$ok" != "1" ]; then echo "푸시 3회 실패"; exit 1; fi
          fi

      # 데이터는 이미 커밋됨. 치명 이상(수집 실패·검증 실패)이 2회 연속이면 여기서 실패 → GitHub 실패 메일.
      - name: 데이터 헬스체크
        run: python healthcheck.py
